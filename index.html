<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý - Một Phút Nữa Thôi</title>
    <!-- Nhúng thư viện AI của Google -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2, h3 { color: #ff6600; text-align: center; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #ff6600; color: white; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        button:hover { background-color: #e65c00; }
        .hidden { display: none; }
        
        /* Cố định khung Camera */
        #webcam-container { text-align: center; margin-top: 15px; }
        canvas { border-radius: 10px; border: 3px solid #ff6600; width: 100%; max-width: 300px; }
        
        /* Bảng thống kê AI */
        .ai-stats { background: #eef2f3; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .ai-stats span { color: red; }

        /* Cảnh báo và Toggle */
        .alert-settings { margin-top: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; display: flex; justify-content: space-between; align-items: center; }
        .alert-message { color: red; font-weight: bold; text-align: center; margin-top: 10px; display: none; padding: 10px; border: 1px solid red; border-radius: 5px; background-color: #ffe6e6; }
        
        /* Switch Toggle Style */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff6600; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>

<div class="container">
    <h2>Trợ Lý "Một Phút Nữa Thôi"</h2>
    
    <!-- KHU VỰC 1: CAMERA AI -->
    <div id="aiSection" class="hidden">
        <h3>Giám sát Học Tập</h3>
        
        <!-- Toggle Cảnh Báo -->
        <div class="alert-settings">
            <span>Bật cảnh báo sao nhãng (>2 phút)</span>
            <label class="switch">
                <input type="checkbox" id="toggleAlert" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <button onclick="startStudy()" id="btnStart" style="background-color: #28a745;">▶ Bắt Đầu Học</button>
        <button onclick="stopStudy()" id="btnStop" class="hidden" style="background-color: #dc3545;">⏹ Kết Thúc Học</button>
        
        <div id="webcam-container"></div>
        
        <!-- Thông báo Cảnh Báo Text -->
        <div id="alertMessage" class="alert-message">
            ⚠️ Bạn đang không tập trung học bài, hãy quay lại và học hành chăm chỉ nhé!
        </div>

        <div class="ai-stats" id="statsBoard" class="hidden">
            Trạng thái hiện tại: <span id="currentStatus" style="color:blue;">Đang chờ...</span><br>
            ⏳ Sao nhãng (Điện thoại): <span id="timePhone">0</span> giây
        </div>
        <hr>
    </div>

    <!-- KHU VỰC 2: CÀI ĐẶT THÔNG TIN -->
    <div id="profileSection">
        <p><i>Cài đặt thông tin lần đầu:</i></p>
        <label>Mã Học Sinh:</label> <input type="text" id="maHS">
        <label>Họ và Tên:</label> <input type="text" id="hoTen">
        <label>Lớp:</label> <input type="text" id="lop">
        <label>Trường:</label> <input type="text" id="truong">
        <button onclick="saveProfile()">Lưu Thông Tin & Bắt Đầu</button>
    </div>

    <!-- KHU VỰC 3: ĐIỀN NHẬT KÝ -->
    <div id="diarySection" class="hidden">
        <h3>Nhật Ký Ngày Hôm Nay</h3>
        <label>Ngày ghi:</label> <input type="date" id="ngay">
        <label>Dự định dùng ĐT (phút):</label> <input type="number" id="duDinhDT" value="0">
        <label>Thực tế đã dùng ĐT (phút):</label> <input type="number" id="thucTeDT" value="0" readonly style="background-color:#e9ecef;">
        <label>Giờ dự định học (HH:MM):</label> <input type="time" id="gioDuDinh">
        <label>Giờ bắt đầu thực tế (HH:MM):</label> <input type="time" id="gioBatDau">
        
        <label>Cảm xúc trước khi học:</label>
        <select id="camXuc">
            <option value="Bình thường">Bình thường</option>
            <option value="Chán nản">Chán nản</option>
            <option value="Mệt mỏi">Mệt mỏi</option>
            <option value="Hào hứng">Hào hứng</option>
        </select>
        
        <label>Hoạt động đã làm trên điện thoại:</label>
        <input type="text" id="hoatDong" placeholder="VD: Lướt TikTok, xem YouTube...">
        
        <button onclick="submitDiary()">Gửi Nhật Ký</button>
        <p id="statusMsg" style="text-align:center; font-weight:bold;"></p>
    </div>
</div>

<script>
    // ---------------- THIẾT LẬP CƠ BẢN ----------------
    const API_URL = "https://script.google.com/macros/s/AKfycbyPeocMhbWgbw79pXfsouG0LjID7fbCAAbbcZurcK6nfnaFUsX_D9WpjoiOJh1EKubWuw/exec"; 
    const URL_MODEL = "https://teachablemachine.withgoogle.com/models/96-U7HX_v/"; 

    let model, webcam, maxPredictions;
    let isPredicting = false;
    let lastTick;
    let thoiGianDienThoai = 0; // Tính bằng giây
    let lastAlertTime = 0; // Lưu thời gian cảnh báo cuối cùng để tránh cảnh báo liên tục

    // Đối tượng SpeechSynthesis cho cảnh báo bằng giọng nói
    const synth = window.speechSynthesis;

    // ---------------- HỆ THỐNG PROFILE ----------------
    function checkProfile() {
        let profile = JSON.parse(localStorage.getItem("studentProfile"));
        if (profile) {
            document.getElementById("profileSection").classList.add("hidden");
            document.getElementById("aiSection").classList.remove("hidden");
            document.getElementById("diarySection").classList.remove("hidden");
            document.getElementById("ngay").valueAsDate = new Date();
        }
    }

    function saveProfile() {
        let profile = {
            maHS: document.getElementById("maHS").value,
            hoTen: document.getElementById("hoTen").value,
            lop: document.getElementById("lop").value,
            truong: document.getElementById("truong").value
        };
        localStorage.setItem("studentProfile", JSON.stringify(profile));
        checkProfile();
    }

    // ---------------- AI CAMERA VISION ----------------
    async function startStudy() {
        document.getElementById("btnStart").classList.add("hidden");
        document.getElementById("btnStop").classList.remove("hidden");
        document.getElementById("currentStatus").innerText = "Đang khởi động Camera...";
        document.getElementById("statsBoard").classList.remove("hidden");

        const modelURL = URL_MODEL + "model.json";
        const metadataURL = URL_MODEL + "metadata.json";

        // Tải mô hình
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Bật Camera
        const flip = true; 
        webcam = new tmImage.Webcam(300, 300, flip); 
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        document.getElementById("webcam-container").innerHTML = ""; 
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        
        isPredicting = true;
        lastTick = Date.now();
        thoiGianDienThoai = 0; // Reset thời gian mỗi lần bắt đầu
        
        // Tự động ghi nhận giờ bắt đầu
        let now = new Date();
        let hours = String(now.getHours()).padStart(2, '0');
        let minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById("gioBatDau").value = `${hours}:${minutes}`;
    }

    async function loop() {
        if(isPredicting) {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }
    }

    function triggerAlert() {
        const toggleAlert = document.getElementById("toggleAlert").checked;
        if (!toggleAlert) return; // Nếu tắt cảnh báo thì thoát

        let now = Date.now();
        // Cảnh báo mỗi 30 giây một lần để tránh spam
        if (now - lastAlertTime > 30000) {
            // Hiển thị cảnh báo văn bản
            document.getElementById("alertMessage").style.display = "block";
            
            // Cảnh báo âm thanh (Giọng nói)
            if (synth.speaking) {
                synth.cancel(); // Dừng nếu đang nói câu trước đó
            }
            const utterThis = new SpeechSynthesisUtterance("Bạn đang không tập trung học bài, hãy quay lại và học hành chăm chỉ nhé");
            utterThis.lang = 'vi-VN';
            synth.speak(utterThis);

            lastAlertTime = now;
            
            // Ẩn văn bản cảnh báo sau 5 giây
            setTimeout(() => {
                document.getElementById("alertMessage").style.display = "none";
            }, 5000);
        }
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        
        // Tìm hành động có xác suất cao nhất
        let highestProb = 0;
        let bestClass = "";
        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                bestClass = prediction[i].className;
            }
        }
        
        document.getElementById("currentStatus").innerText = bestClass;

        // Tính thời gian sao nhãng
        let now = Date.now();
        let delta = (now - lastTick) / 1000; // Đổi ra giây
        lastTick = now;

        // Xử lý logic nếu nhận diện điện thoại hoặc sao nhãng
        // Vui lòng đảm bảo từ khóa 'điện thoại' khớp với nhãn bạn đã train trên Teachable Machine
        if(bestClass.toLowerCase().includes("điện thoại") || bestClass.toLowerCase().includes("phone") || bestClass.toLowerCase().includes("sao nhãng")) {
            thoiGianDienThoai += delta;
            document.getElementById("timePhone").innerText = Math.floor(thoiGianDienThoai);
            document.getElementById("currentStatus").style.color = "red";

            // Kiểm tra nếu thời gian sao nhãng >= 120 giây (2 phút)
            if (thoiGianDienThoai >= 120) {
                triggerAlert();
            }

        } else {
            document.getElementById("currentStatus").style.color = "green";
        }
    }

    function stopStudy() {
        isPredicting = false;
        if(webcam) webcam.stop();
        document.getElementById("btnStart").classList.remove("hidden");
        document.getElementById("btnStop").classList.add("hidden");
        document.getElementById("currentStatus").innerText = "Đã kết thúc học";
        document.getElementById("alertMessage").style.display = "none";
        
        if(synth.speaking) synth.cancel();

        // Tự động điền số phút dùng điện thoại vào form (Làm tròn)
        document.getElementById("thucTeDT").value = Math.floor(thoiGianDienThoai / 60);
    }

    // ---------------- GỬI DỮ LIỆU GOOGLE SHEETS ----------------
    function submitDiary() {
        let profile = JSON.parse(localStorage.getItem("studentProfile"));
        let diaryData = {
            maHS: profile.maHS,
            hoTen: profile.hoTen,
            lop: profile.lop,
            truong: profile.truong,
            ngay: document.getElementById("ngay").value,
            duDinhDT: document.getElementById("duDinhDT").value,
            thucTeDT: document.getElementById("thucTeDT").value,
            gioDuDinh: document.getElementById("gioDuDinh").value,
            gioBatDau: document.getElementById("gioBatDau").value,
            camXuc: document.getElementById("camXuc").value,
            hoatDong: document.getElementById("hoatDong").value
        };

        document.getElementById("statusMsg").innerText = "Đang gửi dữ liệu...";
        document.getElementById("statusMsg").style.color = "blue";
        
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(diaryData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                document.getElementById("statusMsg").innerText = "Đã lưu nhật ký thành công!";
                document.getElementById("statusMsg").style.color = "green";
                thoiGianDienThoai = 0; // Reset thời gian
                document.getElementById("timePhone").innerText = "0";
            }
        });
    }

    checkProfile();
</script>
</body>
</html>
